<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가정퀴즈로 정복하기</title>
<style>
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; font-family: system-ui, 'Malgun Gothic', sans-serif; color:#243b37; background:linear-gradient(145deg,#e1f5e8,#fff5db 65%,#e2efff); }
main { width:min(100%,680px); text-align:center; padding:clamp(24px,6vw,54px); background:#ffffffed; border-radius:32px; box-shadow:0 18px 60px #31594a18; }
.illustration { font-size:clamp(34px,8vw,58px); letter-spacing:5px; margin-bottom:24px; }
h1 { font-size:clamp(27px,6vw,46px); letter-spacing:-.06em; margin:0 0 16px; color:#205c48; word-break:keep-all; }
p { line-height:1.7; color:#526660; word-break:keep-all; }
.choices { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:36px; }
button { font:inherit; cursor:pointer; border:0; border-radius:18px; padding:16px; min-height:52px; font-weight:700; transition:transform .15s, background .15s; }
button:active { transform:scale(.98); }
button:focus-visible,input:focus-visible { outline:3px solid #e49a36; outline-offset:4px; }
.choice { display:grid; gap:8px; justify-items:center; padding:24px 12px; font-size:22px; }
.choice span { font-size:42px; }
.choice small { font-size:14px; font-weight:500; }
.admin { background:#e5edff; color:#304e95; }
.student { background:#d9f3df; color:#205c48; }
.admin:hover { background:#d5e2ff; }
.student:hover { background:#c5ebcf; }
footer { margin-top:30px; font-size:13px; color:#687b74; }
dialog { width:min(420px,calc(100% - 32px)); border:0; border-radius:24px; padding:28px; color:#243b37; box-shadow:0 20px 70px #0003; }
dialog::backdrop { background:#203d3966; backdrop-filter:blur(4px); }
dialog h2 { margin-top:0; }
label { display:block; font-weight:700; margin:16px 0 8px; }
input { width:100%; border:1px solid #a9b9b3; border-radius:12px; padding:15px; font-size:18px; }
.actions { display:flex; gap:10px; margin-top:16px; }
.actions button { flex:1; }
.primary { background:#205c48; color:white; }
.secondary { background:#edf1ef; color:#243b37; }
#error { color:#b42318; min-height:24px; font-size:14px; margin:8px 0; }
[hidden] { display:none !important; }
@media(max-width:480px) { .choices { grid-template-columns:1fr; gap:12px; margin-top:24px; } .choice { padding:18px; } .choice span { font-size:32px; } }
@media(prefers-reduced-motion:reduce) { button { transition:none; } }

main.editing { width:min(100%,900px); text-align:left; }
.panel { border:1px solid #dce8e1; background:#f8fbf9; padding:20px; border-radius:18px; margin:16px 0; }
.panel h3 { margin:0 0 12px; } textarea,select { font:inherit; width:100%; padding:12px; border:1px solid #a9b9b3; border-radius:12px; background:white; } textarea { resize:vertical; min-height:85px; }
.toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; } .answer-row { display:flex; align-items:center; gap:8px; margin:8px 0; } .answer-row input[type=checkbox], .answer-row input[type=radio] { width:24px; height:24px; flex:none; } .answer-row input[type=text] { min-width:0; } .answer-row button { flex:none; padding:8px 12px; } .muted { font-size:14px; color:#526660; } .danger { background:#fee9e6; color:#a22; } .status { color:#205c48; font-weight:700; } .sticky { position:sticky; bottom:0; background:#fff; padding:12px 0; border-top:1px solid #dce8e1; } .sticky button { flex:1; } .editing footer { text-align:center; } @media(max-width:480px){body{padding:12px}.panel{padding:12px}.editing{padding:16px}.toolbar button{font-size:14px}}

body{background:linear-gradient(#ffe2ef 0%,#fff0d7 65%,#e8f3ce 65%);background-attachment:fixed} main{position:relative;z-index:1} .town{background:#fff5e5;border:3px solid #f3c5ae;border-radius:24px;overflow:hidden;margin:14px 0;padding:16px 12px 22px;text-align:center;color:#78452f} .townscape{width:100%;height:auto;max-height:150px;display:block} .teamgrid,.dessertgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.teamcard{background:#fff;border:2px solid #f2c9b1;border-radius:18px;padding:12px;min-width:0;overflow-wrap:anywhere}.teamcard button{width:100%;padding:9px;min-height:42px}.teamcard h3{margin:0 0 8px}.teamcard p{margin:5px 0;font-size:14px}.dessert{background:#fff0f4;color:#75472d;display:grid;justify-items:center;gap:8px;padding:10px}.dessert svg,.mascot svg{width:82px;height:82px;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 5px 2px #b56d4933)}.dessert:nth-child(2n) svg{animation-delay:-.8s}.mascot svg{width:120px;height:120px}.dessert:disabled{opacity:.45;cursor:not-allowed} .phase{font-size:13px;font-weight:800;color:#a45460;letter-spacing:1px}.roster{font-size:14px;margin:6px 0}.town .primary{background:#a74e65}.town .secondary{background:#fae0d5}.town button:disabled{opacity:.45;cursor:not-allowed}.town h2{margin:8px 0}.town .actions{flex-wrap:wrap}.town .actions button{min-width:130px}.town input{background:#fff}.gameoption{display:block;width:100%;margin:8px 0;background:#fff0d5;color:#69442d;text-align:left}.gameoption.selected{outline:3px solid #a74e65;background:#f9d7e6}.notice{min-height:24px;color:#a33d51;font-weight:700}.wide{width:min(100%,900px)}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}@media(max-width:520px){.teamgrid,.dessertgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){.dessert svg,.mascot svg{animation:none}}
</style>
</head>
<body>
<main>
<section id="home">
<div class="illustration" aria-hidden="true">👕 🍎 🏠 📚</div>
<h1>가정퀴즈로 정복하기</h1>
<p>퀴즈로 배우는 가정 교과, 즐겁게 도전하고 실력을 키워요!</p>
<div class="choices">
<button class="choice admin" id="adminButton"><span aria-hidden="true">👩‍🏫</span>관리자용<small>퀴즈 등록 및 관리</small></button>
<button class="choice student" id="studentButton"><span aria-hidden="true">🎮</span>학생용<small>퀴즈 도전하기</small></button>
</div>
</section>
<section id="editor" hidden>
<div class="toolbar"><h1>👩‍🏫 관리자 모드</h1><button class="secondary" id="adminHome">첫 화면</button></div>
<div class="panel"><h3>🔐 학생용 입장 비밀번호</h3><label for="studentPass">학생에게 안내할 비밀번호</label><input id="studentPass" type="text" autocomplete="off" placeholder="비밀번호 설정"><div class="actions"><button class="primary" id="savePass">비밀번호 저장</button></div><p id="passStatus" class="status" role="status"></p></div>
<div class="panel"><h3>🍰 베이커리 타운 게임 운영</h3><label for="capacity">모둠별 최대 인원</label><select id="capacity"></select><p class="muted">총 6개 모둠 · 정원이 차지 않아도 시작 가능 · 첫 입장자가 모둠장입니다.</p><div id="hostTown"></div></div>
<div class="toolbar"><h2>📝 문제 등록 <span id="count"></span></h2><button class="admin" id="addQuestion">+ 문제 추가</button></div>
<p class="muted">객관식은 정답 1개, 다지선다는 정답 여러 개를 선택할 수 있습니다. 단답형은 인정할 정답을 여러 개 등록할 수 있습니다.</p>
<div id="questions"></div><div class="actions sticky"><button class="admin" id="addBottom">+ 문제 추가</button><button class="primary" id="saveQuestions">문제 저장</button></div><p id="saveStatus" class="status" role="status"></p>
</section>
<section id="welcome" hidden><div class="toolbar"><button class="secondary" id="homeButton">첫 화면</button><button class="secondary" id="switchPlayer">다른 학생 입장</button></div><div id="studentTown"></div></section>
<footer>HOME ECONOMICS · QUIZ CLASS</footer>
</main>
<dialog id="passwordDialog" aria-labelledby="dialogTitle">
<form id="passwordForm">
<h2 id="dialogTitle">🔐 관리자 입장</h2>
<p id="passwordHint">관리자 비밀번호를 입력해 주세요.</p>
<label for="password">비밀번호</label>
<input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호 입력" required>
<p id="error" role="alert"></p>
<div class="actions"><button type="button" class="secondary" id="cancelButton">취소</button><button type="submit" class="primary">입장하기</button></div>
</form>
</dialog>
<script>
const ADMIN_PASSWORD='4321', $=id=>document.getElementById(id), dialog=$('passwordDialog');
const KEY='homeQuizV2';
let saved={studentPass:'',questions:[]};
try { const data=JSON.parse(localStorage.getItem(KEY)); if(data && Array.isArray(data.questions)) saved=data; } catch(e){}
let draft=[], mode='admin', dirty=false;
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));saved=next;return true;}catch(e){return false;}}
function show(section){for(const id of ['home','editor','welcome']) $(id).hidden=id!==section;document.querySelector('main').classList.toggle('editing',section==='editor');document.querySelector('main').classList.toggle('wide',section==='welcome');window.scrollTo(0,0);}
function openGate(next){mode=next;$('passwordForm').reset();$('error').textContent='';$('dialogTitle').textContent=next==='admin'?'🔐 관리자 입장':'🔐 학생 입장';$('passwordHint').textContent=next==='admin'?'관리자 비밀번호를 입력해 주세요.':'선생님이 안내한 비밀번호를 입력해 주세요.';if(next==='student'&&!saved.studentPass)$('error').textContent='아직 선생님이 비밀번호를 설정하지 않았습니다.';dialog.showModal();$('password').focus();}
$('password').removeAttribute('inputmode');
$('adminButton').onclick=()=>openGate('admin');$('studentButton').onclick=()=>openGate('student');$('cancelButton').onclick=()=>dialog.close();$('password').oninput=()=>$('error').textContent='';
$('passwordForm').onsubmit=e=>{e.preventDefault();if(mode==='student'&&!saved.studentPass){$('error').textContent='학생용 비밀번호가 아직 설정되지 않았습니다.';return;}if($('password').value!==(mode==='admin'?ADMIN_PASSWORD:saved.studentPass)){$('error').textContent='비밀번호가 일치하지 않습니다.';return;}dialog.close();$('passwordForm').reset();if(mode==='admin'){draft=JSON.parse(JSON.stringify(saved.questions));dirty=false;$('studentPass').value=saved.studentPass;$('passStatus').textContent='';$('saveStatus').textContent='';render();show('editor');renderHost();}else{show('welcome');renderStudent();}};
$('homeButton').onclick=()=>show('home');$('adminHome').onclick=()=>{if(!dirty||confirm('저장하지 않은 문제 변경사항이 있습니다. 나갈까요?'))show('home');};
$('savePass').onclick=()=>{const v=$('studentPass').value.trim();if(!v){$('passStatus').textContent='비밀번호를 입력해 주세요.';return;} $('passStatus').textContent=persist({...saved,studentPass:v})?'학생용 비밀번호가 저장되었습니다.':'저장 실패: 브라우저 저장소를 확인하세요.';};
const types={single:'객관식 (정답 1개)',short:'단답형 (복수 인정답 가능)',multi:'다지선다 (복수 선택)',ox:'OX 문제'};
function fresh(type='single',text=''){return {type,text,options:type==='ox'?['O','X']:type==='short'?[]:['','','',''],correct:[],answers:type==='short'?['']:[]};}
function changed(){dirty=true;$('saveStatus').textContent='저장되지 않은 변경사항이 있습니다.';}
function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n;}
function btn(txt,fn,cls='secondary'){const n=el('button',txt,cls);n.type='button';n.onclick=fn;return n;}
function field(value,placeholder,fn){const n=el('input');n.type='text';n.value=value;n.placeholder=placeholder;n.oninput=()=>{fn(n.value);changed();};return n;}
function render(){const root=$('questions');root.replaceChildren();$('count').textContent=`(${draft.length}/30)`;for(const id of ['addQuestion','addBottom'])$(id).disabled=draft.length>=30;
if(!draft.length)root.append(el('p','아직 등록된 문제가 없습니다. + 문제 추가를 눌러 주세요.','muted'));
draft.forEach((q,i)=>{const card=el('div',undefined,'panel'),head=el('div',undefined,'toolbar');head.append(el('h3',`문제 ${i+1}`),btn('삭제',()=>{if(confirm(`${i+1}번 문제를 삭제할까요?`)){draft.splice(i,1);changed();render();}},'danger'));card.append(head,el('label','문제 유형'));const select=el('select');for(const [v,t] of Object.entries(types)){const o=el('option',t);o.value=v;select.append(o);}select.value=q.type;select.onchange=()=>{draft[i]=fresh(select.value,q.text);changed();render();};card.append(select,el('label','문제 내용'));const ta=el('textarea');ta.value=q.text;ta.placeholder='문제를 입력하세요.';ta.oninput=()=>{q.text=ta.value;changed();};card.append(ta);
if(q.type==='short'){card.append(el('label','인정 정답 (하나라도 일치하면 정답)'));q.answers.forEach((v,j)=>{const row=el('div',undefined,'answer-row');row.append(field(v,`인정 정답 ${j+1}`,x=>q.answers[j]=x),btn('삭제',()=>{q.answers.splice(j,1);changed();render();}));card.append(row);});card.append(btn('+ 인정 정답 추가',()=>{q.answers.push('');changed();render();}));}
else{card.append(el('label',q.type==='multi'?'보기 및 정답 선택 (복수 선택 가능)':'보기 및 정답 선택 (1개)'));q.options.forEach((v,j)=>{const row=el('div',undefined,'answer-row'),check=el('input');check.type=q.type==='multi'?'checkbox':'radio';check.name=`correct-${i}`;check.checked=q.correct.includes(j);check.setAttribute('aria-label',`${j+1}번 보기 정답 지정`);check.onchange=()=>{if(q.type==='multi'){q.correct=check.checked?[...q.correct,j]:q.correct.filter(x=>x!==j);}else q.correct=[j];changed();};row.append(check);if(q.type==='ox')row.append(el('strong',v));else{row.append(field(v,`보기 ${j+1}`,x=>q.options[j]=x));if(q.options.length>2)row.append(btn('삭제',()=>{q.options.splice(j,1);q.correct=q.correct.filter(x=>x!==j).map(x=>x>j?x-1:x);changed();render();}));}card.append(row);});if(q.type!=='ox')card.append(btn('+ 보기 추가',()=>{q.options.push('');changed();render();}));}root.append(card);});}
function add(){if(draft.length>=30)return;draft.push(fresh());changed();render();$('questions').lastElementChild.scrollIntoView({block:'center',behavior:'smooth'});}
$('addQuestion').onclick=add;$('addBottom').onclick=add;
$('saveQuestions').onclick=()=>{for(let i=0;i<draft.length;i++){const q=draft[i];let msg='';if(!q.text.trim())msg='문제 내용을 입력하세요.';else if(q.type==='short'){if(!q.answers.length||q.answers.some(x=>!x.trim()))msg='인정 정답을 모두 입력하세요.';}else if(q.options.some(x=>!x.trim()))msg='보기를 모두 입력하세요.';else if(q.type==='multi'&&q.correct.length<2)msg='정답을 2개 이상 선택하세요.';else if(q.type!=='multi'&&q.correct.length!==1)msg='정답을 1개 선택하세요.';if(msg){$('saveStatus').textContent=`${i+1}번: ${msg}`;$('questions').children[i].scrollIntoView({block:'center'});alert(`${i+1}번: ${msg}`);return;}}if(persist({...saved,questions:JSON.parse(JSON.stringify(draft))})){dirty=false;$('saveStatus').textContent=`${draft.length}개 문제가 저장되었습니다.`;}else $('saveStatus').textContent='저장 실패: 브라우저 저장소를 확인하세요.';};
window.addEventListener('beforeunload',e=>{if(dirty&&!$('editor').hidden){e.preventDefault();e.returnValue='';}});

// Bakery Town: shared local-browser room, no network server.
const ROOM='bakeryTownV3', PLAYER='bakeryPlayerV3';
const sweets=['딸기 케이크','초코 도넛','딸기 마카롱','크루아상','바닐라 컵케이크','푸딩','초코 쿠키','아이스크림'];
const colors=['#f6a1b5','#9b6044','#e2a4df','#e8ac54','#b6d6a0','#f7cc72','#cf955d','#a8d8f0'];
const blankRoom=()=>({capacity:6,phase:'lobby',teams:Array.from({length:6},()=>({members:[],sweet:null})),questions:[]});
let room=blankRoom(), player=null;try{room=JSON.parse(localStorage.getItem(ROOM))||blankRoom();player=sessionStorage.getItem(PLAYER);}catch(e){}
function reloadRoom(){try{room=JSON.parse(localStorage.getItem(ROOM))||blankRoom();}catch(e){}}
function writeRoom(){try{localStorage.setItem(ROOM,JSON.stringify(room));}catch(e){alert('브라우저 저장소를 사용할 수 없습니다.');}refreshTown();}
function refreshTown(){if(!$('editor').hidden)renderHost();if(!$('welcome').hidden)renderStudent();}
window.addEventListener('storage',e=>{if(e.key===ROOM){reloadRoom();refreshTown();}if(e.key===KEY){try{saved=JSON.parse(e.newValue)||saved;}catch(err){}}});
function setPlayer(id){player=id;try{if(id)sessionStorage.setItem(PLAYER,id);else sessionStorage.removeItem(PLAYER);}catch(e){}}
function locate(){for(let i=0;i<6;i++){let m=room.teams[i].members.find(x=>x.id===player);if(m)return {i,m,t:room.teams[i]};}return null;}
function mascot(i){const shapes=[`<rect x="22" y="35" width="76" height="59" rx="13" fill="#ffdcb7"/><path d="M22 54H98V65H22Z" fill="#f498ad"/><path d="M22 44Q30 19 60 31Q90 19 98 44V50Q88 59 78 50Q65 63 52 50Q36 61 22 50Z" fill="#fff6e8"/><path d="M51 29Q40 11 58 14Q76 9 69 29L60 37Z" fill="#e95b73"/>`,`<circle cx="60" cy="60" r="39" fill="#dc9c61"/><circle cx="60" cy="55" r="33" fill="#946047"/><circle cx="60" cy="55" r="12" fill="#fff5e5"/><path d="M36 36l6 4M78 33l5 5M85 65l7 -3M38 75l6 -5" stroke="#ffadc4" stroke-width="4" stroke-linecap="round"/>`,`<ellipse cx="60" cy="45" rx="39" ry="24" fill="#e2a4df"/><rect x="23" y="50" width="74" height="17" rx="8" fill="#fff4df"/><ellipse cx="60" cy="75" rx="39" ry="20" fill="#d98bcf"/>`,`<path d="M13 66Q9 30 42 24Q61 13 79 24Q111 30 107 66L93 93L79 70Q60 82 41 70L27 93Z" fill="#e8ac54" stroke="#c98739" stroke-width="3"/><path d="M42 26Q29 49 41 70M79 26Q91 49 79 70" fill="none" stroke="#c98739" stroke-width="3"/>`,`<path d="M30 60H90L80 101H40Z" fill="#91c9a3"/><path d="M25 61Q9 44 32 37Q30 18 51 24Q58 4 73 24Q94 18 93 38Q111 48 95 61Z" fill="#ffd2df"/>`,`<path d="M35 30H85L99 87Q61 103 21 87Z" fill="#f7cc72"/><ellipse cx="60" cy="31" rx="27" ry="12" fill="#a85d35"/>`,`<circle cx="60" cy="60" r="42" fill="#cf955d" stroke="#a97042" stroke-width="3"/><g fill="#754832"><circle cx="37" cy="36" r="6"/><circle cx="79" cy="36" r="7"/><circle cx="35" cy="77" r="5"/><circle cx="84" cy="79" r="7"/></g>`,`<path d="M35 63H85L60 108Z" fill="#dca35d"/><path d="M43 75L70 91M74 75L49 91" stroke="#b87f40" stroke-width="2"/><circle cx="60" cy="39" r="31" fill="#a8d8f0"/><rect x="28" y="40" width="64" height="26" rx="13" fill="#a8d8f0"/>`];let y=i===7?43:i===4?48:i===1?79:i===5?64:61;return `<svg viewBox="0 0 120 120" aria-hidden="true">${shapes[i]}<g fill="#563e3d"><ellipse cx="48" cy="${y}" rx="3.5" ry="5"/><ellipse cx="72" cy="${y}" rx="3.5" ry="5"/></g><path d="M55 ${y+5}Q60 ${y+11} 65 ${y+5}" fill="none" stroke="#563e3d" stroke-width="2.5" stroke-linecap="round"/><g fill="#ef8da0" opacity=".8"><ellipse cx="40" cy="${y+6}" rx="5" ry="3"/><ellipse cx="80" cy="${y+6}" rx="5" ry="3"/></g></svg>`;}
function scene(){let d=el('div');d.innerHTML=`<svg class="townscape" viewBox="0 0 620 140" aria-hidden="true"><rect width="620" height="140" rx="18" fill="#fce3eb"/><circle cx="530" cy="28" r="18" fill="#fff4b6"/><path d="M0 108Q110 70 220 110T440 108T620 100V140H0Z" fill="#cde4ac"/><g stroke="#a86b50" stroke-width="2">${[0,1,2].map((v)=>{let x=55+v*195;return `<g transform="translate(${x} 0)"><rect x="0" y="48" width="120" height="74" rx="5" fill="${['#fff1ce','#ffe0e8','#d9efda'][v]}"/><path d="M-10 48L60 12L130 48Z" fill="${['#e99b9e','#bba5dc','#eab66d'][v]}"/><rect x="12" y="73" width="32" height="30" rx="5" fill="#bde2ec"/><rect x="76" y="73" width="32" height="30" rx="5" fill="#bde2ec"/><rect x="50" y="80" width="21" height="42" rx="7" fill="#d99c74"/><path d="M-4 53H124L118 68H2Z" fill="#fff6e7"/>${[0,1,2,3].map(k=>`<path d="M${k*32} 53h16l-1 15h-15Z" fill="#e899aa" stroke="none"/>`).join('')}</g>`}).join('')}</g><path d="M0 130H620" stroke="#e4bc8b" stroke-width="16"/><g fill="#fff"><ellipse cx="55" cy="20" rx="24" ry="8"/><ellipse cx="290" cy="18" rx="34" ry="8"/></g></svg>`;return d;}
function town(root,subtitle){root.replaceChildren();const box=el('div',undefined,'town');box.append(scene(),el('div','BAKERY TOWN · SWEET QUIZ','phase'),el('h2','🍰 달콤한 베이커리 타운'),el('p',subtitle));root.append(box);return box;}
function teamGrid(box,student=false){const g=el('div',undefined,'teamgrid');const me=locate();room.teams.forEach((t,i)=>{const c=el('div',undefined,'teamcard');c.append(el('h3',`모둠 ${i+1}`),el('p',`${t.members.length} / ${room.capacity}명`));if(t.sweet!==null){const m=el('div',undefined,'mascot');m.innerHTML=mascot(t.sweet);c.append(m,el('strong',sweets[t.sweet]));}t.members.forEach((m,j)=>c.append(el('div',`${j===0?'👑 ':''}${m.name}${m.id===player?' (나)':''}`,'roster')));if(student&&room.phase==='lobby'){const b=btn(me?.i===i?'참가 중':'이 모둠 선택',()=>joinTeam(i),'secondary');b.disabled=me?.i===i||t.members.length>=room.capacity;c.append(b);}g.append(c);});box.append(g);}
function renderHost(){const box=town($('hostTown'),({lobby:'모둠 결성 대기 중',select:'모둠장이 디저트 캐릭터를 선택하는 중',playing:'퀴즈 게임 진행 중'})[room.phase]);$('capacity').value=room.capacity;$('capacity').disabled=room.phase!=='lobby';teamGrid(box);let active=room.teams.filter(t=>t.members.length);let ready=active.filter(t=>t.sweet!==null).length;box.append(el('p',`참가 ${active.length}개 모둠 · 캐릭터 준비 ${ready}/${active.length}`));let actions=el('div',undefined,'actions');if(room.phase==='lobby'){let b=btn('모둠 결성 완료 · 캐릭터 선택 시작',()=>{reloadRoom();if(!room.teams.some(t=>t.members.length))return;room.phase='select';writeRoom();},'primary');b.disabled=!active.length;actions.append(b);}if(room.phase==='select'){let b=btn('게임 시작!',()=>{reloadRoom();const a=room.teams.filter(t=>t.members.length);if(!a.length||a.some(t=>t.sweet===null))return;if(!saved.questions.length){alert('먼저 문제를 등록하고 저장해 주세요.');return;}if(dirty){alert('변경된 문제를 먼저 저장해 주세요.');return;}room.questions=JSON.parse(JSON.stringify(saved.questions));room.phase='playing';writeRoom();},'primary');b.disabled=!active.length||ready!==active.length;actions.append(b,btn('모둠 결성으로 돌아가기',()=>{reloadRoom();room.phase='lobby';room.teams.forEach(t=>t.sweet=null);writeRoom();}));}actions.append(btn('새 게임 (대기실 초기화)',()=>{if(confirm('현재 참가자와 게임 진행 상태를 초기화할까요? 저장된 문제는 유지됩니다.')){reloadRoom();let cap=room.capacity;room=blankRoom();room.capacity=cap;writeRoom();}},'danger'));box.append(actions);}
for(let n=2;n<=6;n++){const o=el('option',`${n}명`);o.value=n;$('capacity').append(o);}$('capacity').onchange=()=>{reloadRoom();let n=Number($('capacity').value);if(room.phase!=='lobby'||room.teams.some(t=>t.members.length>n)){alert('현재 모둠원보다 적은 정원으로 변경할 수 없습니다.');renderHost();return;}room.capacity=n;writeRoom();};
let pendingName='';let progress={};
$('switchPlayer').onclick=()=>{setPlayer(null);pendingName='';renderStudent();};
function joinTeam(i){reloadRoom();if(room.phase!=='lobby'||room.teams[i].members.length>=room.capacity){renderStudent();return;}let old=locate();let name=old?.m.name||pendingName;if(!name)return;if(old?.i===i)return;if(!player)setPlayer(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());if(old)old.t.members=old.t.members.filter(m=>m.id!==player);room.teams[i].members.push({id:player,name});writeRoom();}
function renderStudent(){let me=locate();const box=town($('studentTown'),room.phase==='lobby'?'친구들과 모둠을 만들어요!':room.phase==='select'?'우리 모둠의 디저트 친구를 골라요!':'달콤한 퀴즈에 도전해요!');if(!me&&!pendingName){const f=el('form');const input=el('input');input.placeholder='이름 또는 닉네임';input.maxLength=24;input.required=true;f.append(input);const b=el('button','대기실 입장','primary');b.type='submit';f.append(b);f.onsubmit=e=>{e.preventDefault();if(input.value.trim()){pendingName=input.value.trim();renderStudent();}};box.append(f);return;}if(!me&&room.phase!=='lobby'){box.append(el('p','이미 게임 준비가 시작되었습니다. 다음 게임을 기다려 주세요.'));return;}box.append(el('strong',`${me?.m.name||pendingName}님 환영해요!`));if(room.phase==='lobby'){teamGrid(box,true);box.append(el('p',me?'선생님이 모둠 결성을 완료할 때까지 기다려 주세요.':'참가할 모둠을 선택하세요.'));return;}if(room.phase==='select'){teamGrid(box);if(me.t.members[0].id!==player){box.append(el('p','👑 모둠장이 캐릭터를 선택할 때까지 기다려 주세요.'));return;}const g=el('div',undefined,'dessertgrid');sweets.forEach((name,i)=>{const b=btn('',()=>{reloadRoom();let current=locate();if(room.phase!=='select'||!current||current.t.members[0].id!==player||room.teams.some((t,j)=>j!==current.i&&t.sweet===i))return;current.t.sweet=i;writeRoom();},'dessert');b.innerHTML=mascot(i);b.append(el('span',name+(me.t.sweet===i?' ✓':'')));b.disabled=room.teams.some((t,j)=>j!==me.i&&t.sweet===i);g.append(b);});box.append(el('h3','👑 모둠장 캐릭터 선택'),g,el('p','선택 후 선생님이 게임을 시작할 때까지 기다려 주세요.'));return;}renderGame(box,me);}
function renderGame(box,me){const m=el('div',undefined,'mascot');m.innerHTML=mascot(me.t.sweet??0);box.append(m,el('h3',`모둠 ${me.i+1} · ${sweets[me.t.sweet]}`));const key=player+JSON.stringify(room.questions);const st=progress[key]||(progress[key]={index:0,score:0,selected:[],answer:'',feedback:null});const q=room.questions[st.index];if(!q){box.append(el('h2','🎉 퀴즈 완료!'),el('p',`${room.questions.length}문제 중 ${st.score}문제 정답`));return;}box.append(el('p',`문제 ${st.index+1} / ${room.questions.length}`),el('h3',q.text));if(q.type==='short'){let input=el('input');input.value=st.answer;input.placeholder='정답을 입력하세요';input.disabled=st.feedback!==null;input.oninput=()=>st.answer=input.value;box.append(input);}else q.options.forEach((v,i)=>{let b=btn(v,()=>{if(st.feedback!==null)return;st.selected=q.type==='multi'?(st.selected.includes(i)?st.selected.filter(x=>x!==i):[...st.selected,i]):[i];renderStudent();},'gameoption'+(st.selected.includes(i)?' selected':''));b.disabled=st.feedback!==null;box.append(b);});if(st.feedback===null)box.append(btn('정답 제출',()=>{if(q.type==='short'?!st.answer.trim():!st.selected.length){alert('답을 선택하거나 입력하세요.');return;}let norm=x=>x.trim().toLowerCase().replace(/\s+/g,'');let ok=q.type==='short'?q.answers.some(a=>norm(a)===norm(st.answer)):q.correct.length===st.selected.length&&q.correct.every(x=>st.selected.includes(x));st.feedback=ok;st.score+=Number(ok);renderStudent();},'primary'));else{box.append(el('p',st.feedback?'정답이에요! 🍪':'아쉬워요! 다음 문제에 도전해요.'),btn('다음',()=>{st.index++;st.selected=[];st.answer='';st.feedback=null;renderStudent();},'primary'));}}

</script></body></html>
